[build-system]
build-backend = "mesonpy"
requires = [
  "meson-python>=0.16.0",
  "ninja",
  "Cython>=3.1.0",
  "numpy>=2",
  "mkl-devel",
  "cmake"
]

[project]
authors = [
  { name = "Intel Corporation", email = "scripting@intel.com" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: C",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix"
]
dependencies = ["numpy >=2"]
description = "Intel (R) MKL-based universal functions for NumPy arrays"
dynamic = ["version"]
keywords = ["mkl_umath"]
license = "BSD-3-Clause"
name = "mkl_umath"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.16"

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Download = "http://github.com/IntelPython/mkl_umath"
Homepage = "http://github.com/IntelPython/mkl_umath"

[tool.black]
extend-exclude = "(^|/)_vendored/"
force-exclude = "(^|/)_vendored/"
line-length = 80

[tool.cibuildwheel]
build-verbosity = 1

[tool.cibuildwheel.linux]
# Intel's icx, as the conda recipe builds with, from Intel's repository
before-all = [
  "rpm --import https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB",
  "printf '[oneAPI]\\nname=Intel oneAPI\\nbaseurl=https://yum.repos.intel.com/oneapi\\nenabled=1\\ngpgcheck=1\\nrepo_gpgcheck=1\\ngpgkey=https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB\\n' > /etc/yum.repos.d/oneAPI.repo",
  "dnf install -y intel-oneapi-compiler-dpcpp-cpp"
]
environment = { CC = "/opt/intel/oneapi/compiler/latest/bin/icx" }
# MKL, OpenMP and icx's runtime come from wheels at run time, see [tool.gh-ci]
repair-wheel-command = "auditwheel repair --exclude libmkl_intel_lp64.so.3 --exclude libmkl_intel_thread.so.3 --exclude libmkl_core.so.3 --exclude libiomp5.so --exclude libimf.so --exclude libsvml.so --exclude libirng.so --exclude libintlc.so.5 -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
# MSVC's environment, as python.org builds CPython with, and icx from conda-forge
before-all = "python {project}/ci/install_icx.py C:/icx"
config-settings = { setup-args = "--vsenv" }
environment = { CC = "C:/icx/Library/bin/icx.exe", LIB = "C:/icx/Library/lib;$LIB", LINK = "/LIBPATH:C:/icx/Library/lib" }
# MKL, OpenMP and icx's runtime come from wheels at run time, see [tool.gh-ci]
repair-wheel-command = "delvewheel repair --no-dll mkl_umath_loops.dll;mkl_intel_thread.3.dll;mkl_core.3.dll;libiomp5md.dll;libmmd.dll;svml_dispmd.dll;libircmd.dll;libirngmd.dll -w {dest_dir} {wheel}"

[tool.gh-ci]
# What the wheels need at run time, which conda packages get from the recipe
wheel-requires = ["mkl >=2026.2,<2027", "intel-openmp >=2026.2,<2027", "intel-cmplr-lib-rt >=2026.2,<2027"]

[tool.isort]
ensure_newline_before_comments = true
force_grid_wrap = 0
include_trailing_comma = true
line_length = 80
multi_line_output = 3
skip = ["_vendored/conv_template.py", "_vendored/process_src_template.py"]
use_parentheses = true
