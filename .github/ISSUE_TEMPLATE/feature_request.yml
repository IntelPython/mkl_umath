name: Feature request
description: Propose a new ufunc loop, dtype, or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        What you would like `mkl_umath` to do. If it covers a NumPy ufunc, name
        it — NumPy's semantics are the contract for patched loops.
    validations:
      required: true

  - type: input
    id: upstream
    attributes:
      label: Upstream equivalent
      description: Link to the NumPy docs for the ufunc, if there is one.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Workarounds you are using today.
    validations:
      required: false
