name: Build using pip and pre-release NumPy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
         shell: bash -el {0}

    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        use_pre: ["", "--pre"]
        include:
          - python: "3.14"
            python_spec: "3.14.* *_cp314"
            use_pre: ""
          - python: "3.14"
            python_spec: "3.14.* *_cp314"
            use_pre: "--pre"
          - python: "3.14"
            python_spec: "3.14.* *_cp314t"
            use_pre: ""
          - python: "3.14"
            python_spec: "3.14.* *_cp314t"
            use_pre: "--pre"
          - python: "3.15"
            python_spec: "3.15.* *_cp315"
            use_pre: ""
          - python: "3.15"
            python_spec: "3.15.* *_cp315"
            use_pre: "--pre"

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          use-mamba: true
          miniforge-version: latest
          # conda-forge/label/python_rc carries the 3.15 release candidate
          channels: https://software.repos.intel.com/python/conda, conda-forge, conda-forge/label/python_rc
          conda-remove-defaults: true
          activate-environment: test
          python-version: ${{ matrix.python }}

      - name: Install Compiler and MKL
        run: |
          conda install mkl-devel dpcpp_linux-64 "python=${{ matrix.python_spec || matrix.python }}"
          python -c "import sys; print(sys.executable)"
          which python

      - name: Build with pip
        run: |
          pip install --no-cache-dir meson-python ninja cmake "cython>=3.1.0"
          pip install --no-cache-dir numpy ${{ matrix.use_pre }}
          CC=icx pip install -e . --no-build-isolation --no-deps --verbose
          pip install --no-cache-dir pytest
          pip list
          python -m pytest -sv --pyargs mkl_umath
