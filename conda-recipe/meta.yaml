package:
    name: mkl_umath
    version: {{ GIT_DESCRIBE_TAG }}

source:
    path: ../

build:
    number: {{ GIT_DESCRIBE_NUMBER }}
    skip: true  # [osx]
    ignore_run_exports_from:
      - {{ compiler('dpcpp') }}  # [linux]
    ignore_run_exports:
      - blas
    missing_dso_whitelist:
      - $RPATH/mkl_umath_loops.dll  # [win]

requirements:
    build:
      - {{ compiler('c') }}
      - {{ compiler('cxx') }}
      - {{ stdlib('c') }}
      - {{ compiler('dpcpp') }} >=2024.2  # [not osx]
    host:
      - meson-python >=0.16.0
      - cmake
      - ninja
      - git
      - cython >=3.1.0
      - python
      - mkl-devel
      - intel-cmplr-lib-rt  # [not osx]
      - numpy
      - llvm-openmp
      - pip
    run:
      - python
      # NumPy 2 only, as pyproject.toml says; numpy's run_exports add the upper bound
      - numpy >=2

test:
    requires:
      - pip
      - pytest
    commands:
      - pip check
      - pytest --pyargs mkl_umath
    imports:
      - mkl_umath
      - mkl_umath._ufuncs
      - mkl_umath._patch_numpy

about:
    home: http://github.com/IntelPython/mkl_umath
    license: BSD-3-Clause
    license_file: LICENSE.txt
    summary: Universal functions for real and complex floating point arrays powered by Intel(R) Math Kernel Library Vector (Intel(R) MKL) and Intel(R) Short Vector Math Library (Intel(R) SVML)
    description: |
        <strong>LEGAL NOTICE: Use of this software package is subject to the
        software license agreement (as set forth above, in the license section of
        the installed Conda package and/or the README file) and all notices,
        disclaimers or license terms for third party or open source software
        included in or with the software.</strong>
        <br/><br/>
        EULA: <a href="https://opensource.org/licenses/BSD-3-Clause" target="_blank">BSD-3-Clause</a>
        <br/><br/>
